<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OposiTAI · TAI 2026</title>
<meta name="description" content="Seguimiento del temario TAI 2026: lecturas, resúmenes y plazos.">
<script>try{var t=localStorage.getItem("tai2026-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
    --scheme:light;
    --bg:#ffffff;--band-top:#f1ecfd;--band-top-line:#e2d8fb;--band-blocks:#f4f4f6;
    --surface:#ffffff;--surface-2:#f3f3f5;--border:#e4e4e8;--border-hi:#c9c9d1;
    --text:#18181b;--muted:#52525b;--faint:#a1a1aa;--ctl:#85858f;--track:#e9e6f2;
    --nav-bg:rgba(255,255,255,.88);--focus:#6d28d9;
    --c-a:#7c3aed;--c-a-ink:#6d28d9;--on-a:#ffffff;--soft-a:#efe9fe;
    --c-b:#c2410c;--c-b-ink:#c2410c;--on-b:#ffffff;--soft-b:#fef1e8;
    --c-r:#fbbf24;--c-r-ink:#92400e;--on-r:#3b2604;--soft-r:#fdf1c7;
    --ok:#16a34a;--warn:#d97706;--bad:#dc2626;
    --shadow:0 1px 2px rgba(24,24,27,.05),0 4px 14px -6px rgba(76,29,149,.10);
    --b1-soft:#e7f6ed;--b1-ink:#166534;--b2-soft:#fdefe3;--b2-ink:#9a4508;
    --b3-soft:#fce9f2;--b3-ink:#be185d;--b4-soft:#f1e9fd;--b4-ink:#7e22ce;--pat-a:20%;--dot-a:7%;
    --r-lg:16px;--r-md:12px;--r-sm:8px;
    --display:"Inter Tight",system-ui,sans-serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --scheme:dark;
    --bg:#0f0f12;--band-top:#1b1730;--band-top-line:#2e2849;--band-blocks:#131317;
    --surface:#1f1f25;--surface-2:#2a2a31;--border:#34343c;--border-hi:#4a4a54;
    --text:#fafafa;--muted:#c3c3cc;--faint:#71717a;--ctl:#8a8a94;--track:#3a3746;
    --nav-bg:rgba(15,15,18,.86);--focus:#fcd34d;
    --c-a:#a78bfa;--c-a-ink:#c4b5fd;--on-a:#1a1033;--soft-a:rgba(167,139,250,.16);
    --c-b:#ff7a45;--c-b-ink:#ffa07a;--on-b:#2a0f02;--soft-b:rgba(255,122,69,.15);
    --c-r:#fbbf24;--c-r-ink:#fcd34d;--on-r:#2a1c00;--soft-r:rgba(251,191,36,.14);
    --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -12px rgba(0,0,0,.6);
    --b1-soft:#17301f;--b1-ink:#86efac;--b2-soft:#33240f;--b2-ink:#fdba74;
    --b3-soft:#331a2a;--b3-ink:#f9a8d4;--b4-soft:#281f3d;--b4-ink:#d8b4fe;--pat-a:10%;--dot-a:4%; } }
  :root[data-theme="dark"]{ --scheme:dark;
    --bg:#0f0f12;--band-top:#1b1730;--band-top-line:#2e2849;--band-blocks:#131317;
    --surface:#1f1f25;--surface-2:#2a2a31;--border:#34343c;--border-hi:#4a4a54;
    --text:#fafafa;--muted:#c3c3cc;--faint:#71717a;--ctl:#8a8a94;--track:#3a3746;
    --nav-bg:rgba(15,15,18,.86);--focus:#fcd34d;
    --c-a:#a78bfa;--c-a-ink:#c4b5fd;--on-a:#1a1033;--soft-a:rgba(167,139,250,.16);
    --c-b:#ff7a45;--c-b-ink:#ffa07a;--on-b:#2a0f02;--soft-b:rgba(255,122,69,.15);
    --c-r:#fbbf24;--c-r-ink:#fcd34d;--on-r:#2a1c00;--soft-r:rgba(251,191,36,.14);
    --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -12px rgba(0,0,0,.6);
    --b1-soft:#17301f;--b1-ink:#86efac;--b2-soft:#33240f;--b2-ink:#fdba74;
    --b3-soft:#331a2a;--b3-ink:#f9a8d4;--b4-soft:#281f3d;--b4-ink:#d8b4fe;--pat-a:10%;--dot-a:4%; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--bg);color-scheme:var(--scheme)}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--focus);outline-offset:3px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}

  /* ================= NAV ================= */
  .nav{position:sticky;top:0;z-index:40;background:var(--nav-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  .nav-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .brand{text-decoration:none;font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap;margin-right:auto}
  .brace{color:var(--c-r-ink)}
  .grad{background:linear-gradient(90deg,var(--c-a-ink),var(--c-b-ink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .inap{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--border-hi);transition:border-color .2s,background .2s}
  .inap:hover{border-color:var(--text);background:var(--surface-2)}
  .inap svg{width:14px;height:14px}
  .today{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .today .dl::first-letter{text-transform:uppercase}
  .today .ds{display:none}

  /* ================= CABECERA ================= */
  header{padding:44px 0 28px}
  .eyebrow{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
  .eyebrow span+span::before{content:"·";margin-right:8px;color:var(--faint)}
  h1{font-family:var(--display);font-size:clamp(40px,7vw,64px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin-top:10px}
  .now{font-size:18px;color:var(--muted);margin-top:14px;max-width:640px;line-height:1.55}
  .now b{color:var(--text);font-weight:700}

  /* ================= WIDGETS ================= */
  .widgets{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .w{
    --acc:var(--c-a);--acc-ink:var(--c-a-ink);--acc-soft:var(--soft-a);--on-acc:var(--on-a);
    position:relative;padding:20px;display:flex;flex-direction:column;gap:16px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transition:border-color .3s,box-shadow .3s;
  }
  .w[data-k="b"]{--acc:var(--c-b);--acc-ink:var(--c-b-ink);--acc-soft:var(--soft-b);--on-acc:var(--on-b);animation-delay:.06s}
  .w[data-k="r"]{--acc:var(--c-r);--acc-ink:var(--c-r-ink);--acc-soft:var(--soft-r);--on-acc:var(--on-r);animation-delay:.12s}
  .w.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),var(--shadow)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .w-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .w-label{font-size:13px;font-weight:600;color:var(--muted)}
  .w-title{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px;display:flex;align-items:center;gap:9px}
  .w-title::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--acc);flex:none}
  .w-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--acc);color:var(--on-acc)}
  .w-badge.soft{background:var(--surface-2);color:var(--muted)}
  .w-mid{display:flex;align-items:center;gap:18px}
  .ring{width:96px;height:96px;position:relative;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{fill:none;stroke:var(--track)}
  .ring .fg{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
  .ring .tick{stroke:var(--text);stroke-linecap:round;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
  .ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring-n{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .ring-of{font-size:12px;color:var(--muted);margin-top:3px}
  .w-stats{min-width:0}
  .w-days{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .w-days b{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
  .w-days span{font-size:14px;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .chip.ok i{background:var(--ok)} .chip.warn i{background:var(--warn)} .chip.bad i{background:var(--bad)}
  .w-pace{font-size:14px;color:var(--muted);line-height:1.5}
  .w-pace b{color:var(--text);font-weight:700}
  .mbars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
  .mbar small{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mbar div{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
  .mbar i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}

  /* ================= BLOQUES ================= */
  .section-h{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin:48px 0 14px}
  .section-h h2{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.025em}
  .section-h p{font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
  .section-h p i{width:10px;height:10px;border-radius:3px;background:var(--phase)}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tab{text-align:left;border-radius:var(--r-md);padding:14px 16px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;gap:12px;transition:border-color .2s,background .2s,box-shadow .2s}
  .tab:hover{border-color:var(--border-hi)}
  .tab[aria-selected="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
  .tab>div:last-child{min-width:0}
  .t-ring{width:40px;height:40px;flex:none}
  .t-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .t-ring .bg{fill:none;stroke:var(--track)}
  .t-ring .fg{fill:none;stroke:var(--phase);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
  .t-roman{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .t-name{font-size:15px;font-weight:700;line-height:1.25;margin-top:1px;hyphens:auto;-webkit-hyphens:auto}
  .t-count{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}

  /* ================= PANEL ================= */
  .panel{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
  .p-head{padding:22px 24px;border-bottom:1px solid var(--border)}
  .p-tag{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .p-title{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-top:4px}
  .p-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px;max-width:560px}
  .p-stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
  .p-stat small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
  .p-stat b{font-family:var(--display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .p-stat .mini{height:5px;border-radius:3px;background:var(--track);margin-top:6px;overflow:hidden}
  .p-stat .mini i{display:block;height:100%;border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  #pm-a{background:var(--c-a)} #pm-b{background:var(--c-b)} #pm-r{background:var(--c-r)}
  .thead{display:none}
  .list{list-style:none;padding:8px}
  .row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-sm);transition:background .2s;animation:fadeIn .4s cubic-bezier(.2,.8,.2,1) both}
  .row:hover{background:var(--surface-2)}
  .row+.row{border-top:1px solid var(--border)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .num{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);background:var(--surface-2);font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
  .row.ra .num{background:var(--soft-a);color:var(--c-a-ink)}
  .row.rb .num{background:var(--soft-b);color:var(--c-b-ink)}
  .ttext{flex:1;min-width:0}
  .ttitle{font-size:16px;line-height:1.45;font-weight:500;overflow-wrap:anywhere}
  .tstate{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:4px 14px;flex-wrap:wrap}
  .tstate span{display:inline-flex;align-items:center;gap:6px}
  .tstate i{width:8px;height:8px;border-radius:50%}

  .acts{display:flex;gap:6px;flex:none}
  .tg{
    --t:var(--c-a);--on:var(--on-a);
    height:36px;padding:0 12px 0 8px;border-radius:10px;display:inline-flex;align-items:center;gap:7px;
    font-size:14px;font-weight:600;color:var(--muted);border:1px solid var(--border-hi);background:var(--surface);white-space:nowrap;
    transition:background .2s,color .2s,border-color .2s,transform .15s;
  }
  .tg[data-k="b"]{--t:var(--c-b);--on:var(--on-b)}
  .tg[data-k="r"]{--t:var(--c-r);--on:var(--on-r)}
  .tg .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ctl);display:grid;place-items:center;flex:none;transition:border-color .2s,background .2s}
  .tg .box svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1.4)}
  .tg:hover{border-color:var(--t);color:var(--text)}
  .tg:hover .box{border-color:var(--t)}
  .tg:active{transform:scale(.95)}
  .tg.on{background:var(--t);border-color:var(--t);color:var(--on)}
  .tg.on .box{border-color:currentColor}
  .tg.on .box svg{opacity:1;transform:none}

  /* ================= FOOTER ================= */
  footer{margin-top:56px;padding:28px 16px 40px;border-top:1px solid var(--border);text-align:center}
  .foot{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center}
  .foot a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--mono);font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--border-hi);transition:border-color .2s}
  .foot a:hover{border-color:var(--text)}
  .foot a svg{width:14px;height:14px;color:var(--text)}
  .src{font-size:13px;color:var(--muted);margin-top:12px}
  .backup{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;align-items:center;margin-top:14px}
  .bk{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--border-hi);transition:border-color .2s}
  .bk:hover{border-color:var(--text)}

  /* ================= EFECTOS ================= */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:60}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;z-index:70;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
  .toast.show{transform:translate(-50%,0);opacity:1}

  /* ================= RESPONSIVE ================= */
  @media (max-width:900px){
    .widgets{grid-template-columns:1fr}
    .tabs{grid-template-columns:repeat(2,1fr)}
    .today .long{display:none}
  }
  @media (max-width:640px){
    .nav-in{gap:8px;padding:10px 16px}
    .brand{font-size:14px}
    .inap{padding:6px 10px;font-size:13px}
    .inap .ext{display:none}
    .today{font-size:13px}
    .today .dl{display:none}
    .today .ds{display:inline}
    header{padding:28px 0 22px}
    .now{font-size:16px}
    .w{padding:18px}
    .ring{width:84px;height:84px}
    .ring-n{font-size:24px}
    .tab{padding:12px;gap:10px}
    .t-ring{width:30px;height:30px}
    .t-name{font-size:14px}
    .p-head{padding:18px}
    .p-title{font-size:21px}
    .p-stat{padding:8px 10px}
    .p-stat b{font-size:17px}
    .list{padding:6px}
    .row{flex-wrap:wrap;gap:10px 12px;padding:12px 10px;align-items:flex-start}
    .ttext{flex:1 1 calc(100% - 52px);padding-top:6px}
    .acts{margin-left:48px}
    .tg{height:34px;font-size:13px;padding:0 10px 0 7px}
    .tg .lf{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none !important;transition:none !important}
  }

  /* ================= VARIANTE: Tabla ================= */
  /* nav con INAP centrado */
  .nav-c{display:grid;grid-template-columns:1fr auto 1fr;gap:12px}
  .nav-c .brand{margin-right:0;justify-self:start}
  .nav-r{justify-self:end;display:flex;align-items:center;gap:12px}
  .inap{padding:7px 18px;letter-spacing:.04em;font-weight:700}
  .theme-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border-hi);display:grid;place-items:center;flex:none;transition:border-color .2s}
  .theme-btn:hover{border-color:var(--text)}
  .theme-btn svg{width:18px;height:18px}
  h1{color:var(--text);margin-top:0}
  /* título: Inter Tight 800, entrada "tracking-in" (las letras se juntan y se enfocan) + punto de acento */
  .title{font-size:clamp(46px,8vw,80px);line-height:1;letter-spacing:-.03em;word-spacing:.06em;white-space:nowrap}
  .section-h h2,.p-title,.w-title{letter-spacing:-.012em}
  .w-count b{letter-spacing:-.02em}
  .title .tt{display:inline-block;animation:trackIn 2s cubic-bezier(.22,1,.36,1) .15s both}
  .title .dot{display:inline-block;color:var(--c-a);transform:scale(0);transform-origin:50% 85%;
    animation:dotIn .8s cubic-bezier(.34,1.56,.64,1) 1.7s forwards}
  header .now{animation:fadeSoft 1.1s cubic-bezier(.16,1,.3,1) 1.3s both}
  @keyframes trackIn{0%{letter-spacing:.32em;opacity:0;filter:blur(14px)}45%{opacity:1}100%{letter-spacing:-.03em;opacity:1;filter:blur(0)}}
  @keyframes dotIn{to{transform:none}}
  @keyframes fadeSoft{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.title .dot{transform:none}}

  /* "vas por aquí": marcador por tema */
  .num{cursor:pointer;border:1px solid transparent;position:relative}
  .num .bm{display:none;width:17px;height:17px}
  .num:hover{border-color:var(--phase)}
  @media (hover:hover){ .row:not(.here) .num:hover .n{display:none} .row:not(.here) .num:hover .bm{display:block;color:var(--phase)} }
  .row.here{background:color-mix(in srgb,var(--phase) 9%,var(--surface));box-shadow:inset 4px 0 0 var(--phase)}
  .row.here:hover{background:color-mix(in srgb,var(--phase) 13%,var(--surface))}
  .row.here .num{background:var(--phase);color:var(--surface);border-color:var(--phase);box-shadow:0 0 0 4px color-mix(in srgb,var(--phase) 22%,transparent)}
  .row.here .num .n{display:none}
  .row.here .num .bm{display:block}
  .row.here .num .bm path{fill:currentColor}
  .tstate .here-tag{color:var(--text);font-weight:700}
  .row.flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%,30%{background:color-mix(in srgb,var(--phase) 24%,var(--surface))}}
  .t-here{position:absolute;top:10px;right:10px;display:none;align-items:center;gap:2px;color:var(--blk-ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .t-here svg{width:18px;height:18px;display:block}
  .t-here svg path{fill:currentColor}
  .tab.has-here .t-here{display:flex}
  .p-hint{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;color:var(--muted)}
  .p-hint svg{width:14px;height:14px;flex:none}

  /* franjas de fondo */
  .band{padding:0 0 44px}
  .band-top{background:var(--band-top);border-bottom:1px solid var(--band-top-line)}
  .band-blocks{background:var(--band-blocks);padding-top:40px;padding-bottom:56px}
  .band-blocks .section-h{margin-top:0}
  footer{margin-top:0;background:var(--bg)}

  /* tarjetas de progreso simples */
  .widgets{gap:16px}
  .w-s{gap:0;padding:20px 20px 18px}
  .w-s.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),var(--shadow)}
  .w-s .w-top{align-items:center}
  .w-s .w-title{font-size:19px;margin:0}
  .w-s .w-label{font-size:14px;font-weight:500;color:var(--muted);margin-top:4px}
  .w-dl{display:flex;align-items:center;gap:4px;margin-top:4px;min-height:30px}
  .w-dl[hidden],.dl-form[hidden]{display:none}
  .w-s .w-dl .w-label{margin-top:0}
  .edit{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--muted);border:1px solid transparent;transition:color .2s,background .2s,border-color .2s}
  .edit:hover{color:var(--acc-ink);background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
  .edit svg{width:16px;height:16px}
  .dl-form{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
  .dl-form input{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--ctl);background:var(--surface);color:var(--text);font:inherit;font-size:14px;color-scheme:var(--scheme);min-width:0}
  .dl-form input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  .btn-p,.btn-g{height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:700;transition:filter .2s,border-color .2s}
  .btn-p{background:var(--acc);color:var(--on-acc)}
  .btn-p:hover{filter:brightness(1.08)}
  .btn-g{border:1px solid var(--border-hi);color:var(--muted);width:34px;padding:0;display:grid;place-items:center}
  .btn-g svg{width:15px;height:15px}
  .dl-form input{flex:1 1 130px;max-width:170px}
  .btn-g:hover{border-color:var(--text);color:var(--text)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .w-s .w-label b{color:var(--text);font-weight:700}
  .w-s{padding:18px 18px 16px}
  .widgets{align-items:start}
  .w-count{display:flex;align-items:baseline;gap:6px;margin-top:10px}
  .w-count b{font-family:var(--display);font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .w-count span{font-size:14px;color:var(--muted)}
  /* temas leídos frente a plazo consumido */
  .cmp{display:grid;gap:7px;margin-top:12px}
  .cmp-r{display:grid;grid-template-columns:50px minmax(0,1fr) 40px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .cmp-r span{font-weight:600}
  .cmp-r b{text-align:right;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
  .cmp-t{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
  .cmp-t i{display:block;height:100%;width:0;border-radius:4px;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .cmp-r+.cmp-r .cmp-t i{background:color-mix(in srgb,var(--text) 38%,transparent)}
  /* veredicto */
  .verdict{display:flex;align-items:flex-start;gap:8px;margin-top:14px;padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.4;background:var(--surface-2);color:var(--text)}
  .verdict[hidden]{display:none}
  .w-s.pending .cmp,.w-s.pending .w-count{display:none}
  .verdict i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;margin-top:5px}
  .verdict.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface))} .verdict.ok i{background:var(--ok)}
  .verdict.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))} .verdict.warn i{background:var(--warn)}
  .verdict.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))} .verdict.bad i{background:var(--bad)}
  /* ritmo real frente a necesario */
  .paces{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .paces[hidden]{display:none}
  .paces>div{min-width:0}
  .paces small{display:block;font-size:12px;color:var(--muted)}
  .paces span{font-size:13px;color:var(--muted);white-space:nowrap}
  .paces span b{font-family:var(--display);font-size:17px;color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
  .paces em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:1px}
  .paces em.up{color:var(--ok)} .paces em.dn{color:var(--bad)}


  /* ================= PLAZOS: panel con pestañas ================= */
  .plazo{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
  .ptabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--border);background:var(--surface-2)}
  .ptab{--t:var(--c-a);display:flex;align-items:center;gap:8px;padding:14px 18px;font-size:15px;font-weight:600;color:var(--muted);
    border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .2s,background .2s,border-color .2s;min-width:0}
  .ptab[data-k="b"]{--t:var(--c-b)} .ptab[data-k="r"]{--t:var(--c-r)}
  .ptab+.ptab{border-left:1px solid var(--border)}
  .ptab i{width:10px;height:10px;border-radius:3px;background:var(--t);flex:none}
  .ptab .pt-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptab .pt-c{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .ptab:hover{color:var(--text)}
  .ptab[aria-selected="true"]{background:var(--surface);color:var(--text);border-bottom-color:var(--t)}
  .pz-body{--acc:var(--c-a);--acc-ink:var(--c-a-ink);--acc-soft:var(--soft-a);--on-acc:var(--on-a);padding:28px 28px 26px}
  .pz-body[data-k="b"]{--acc:var(--c-b);--acc-ink:var(--c-b-ink);--acc-soft:var(--soft-b);--on-acc:var(--on-b)}
  .pz-body[data-k="r"]{--acc:var(--c-r);--acc-ink:var(--c-r-ink);--acc-soft:var(--soft-r);--on-acc:var(--on-r)}
  :root{--time:#0a84ff;--time-2:#5ac8fa;--g-ok:#30d158;--g-bad:#ff453a}
  /* cabecera: veredicto + fecha límite */
  .pz-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px 40px;align-items:center}
  .pz-main{min-width:0}
  .pz-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 20px;flex-wrap:wrap}
  .pz-eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
  .pz-h{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
  .pz-h em{font-style:normal}
  .pz-h.ok em{color:var(--ok)} .pz-h.bad em{color:var(--bad)} .pz-h.warn em{color:var(--warn)}
  .pz-note{font-size:13px;color:var(--muted);margin-top:6px}
  .pz-note:empty{display:none}
  .pz-dl{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted);padding:4px 4px 4px 12px;border-radius:999px;background:var(--surface-2)}
  .pz-dl[hidden]{display:none}
  .pz-dl b{color:var(--text);margin-left:4px}
  .pz-dl .edit{width:28px;height:28px;border-radius:999px}
  /* anillos */
  .rings{position:relative;width:196px;height:196px;flex:none}
  .rings svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .rings .trk{fill:none;stroke-width:20}
  .rings .arc{fill:none;stroke-width:20;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1);filter:drop-shadow(0 0 1px rgba(0,0,0,.08))}
  .rings .trk.o{stroke:color-mix(in srgb,var(--acc) 16%,transparent)}
  .rings .trk.i{stroke:color-mix(in srgb,var(--time) 14%,transparent)}
  .ring-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring-in b{font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
  .ring-in span{font-size:13px;color:var(--muted);margin-top:2px}
  .ring-leg{display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:12px;color:var(--muted)}
  .ring-leg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .ring-leg i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
  .ring-leg span+span i{background:var(--time)}
  .ring-leg b{color:var(--text);font-variant-numeric:tabular-nums}
  /* métricas */
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
  .tile{background:var(--surface-2);border-radius:18px;padding:14px 16px 15px;min-width:0}
  .tile small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
  .tile .v{display:flex;align-items:baseline;gap:5px;margin-top:6px;white-space:nowrap}
  .tile .v b{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .tile .v span{font-size:13px;font-weight:600;color:var(--muted)}
  .tile .d{display:block;font-size:12px;font-weight:700;margin-top:6px;color:var(--muted)}
  .tile .d.ok{color:var(--ok)} .tile .d.bad{color:var(--bad)}
  /* temas por semana */
  .weeks{margin-top:26px;padding-top:22px;border-top:1px solid var(--border)}
  .wk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .wk-h h4{font-size:15px;font-weight:700}
  .wk-sub{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
  .wk-h p{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
  .wk-h p i{width:16px;border-top:2px dashed var(--muted)}
  .wk-plot{position:relative;height:150px;margin-top:26px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;align-items:end;border-bottom:1px solid var(--border)}
  .wk-col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .wk-bar{width:min(100%,34px);border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--g1),var(--g2));opacity:.5;transition:height .9s cubic-bezier(.22,1,.36,1);min-height:4px}
  .wk-bar.zero{background:var(--track);opacity:1}
  .wk-col.cur .wk-bar{opacity:1;box-shadow:0 6px 16px -8px var(--g2)}
  .wk-n{font-size:12px;font-weight:700;margin-bottom:5px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .wk-col.cur .wk-n{color:var(--text)}
  .wk-need{position:absolute;left:0;right:0;border-top:2px dashed color-mix(in srgb,var(--text) 45%,transparent);pointer-events:none;transition:bottom .9s cubic-bezier(.22,1,.36,1)}
  .wk-need span{position:absolute;right:0;top:0;transform:translateY(-130%);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--text);color:var(--surface);white-space:nowrap}
  .wk-x{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;margin-top:8px}
  .wk-x span{text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .wk-x span.cur{color:var(--acc-ink);font-weight:700}
  .wk-col.fut .wk-bar{background:var(--track);opacity:.7}
  .wk-x span.sk{visibility:hidden}
  .wk-x span:last-child{display:flex;justify-content:flex-end}
  .wk-bar{width:min(100%,30px)}
  @media (max-width:640px){ .wk-x span.skm{visibility:hidden} .wk-x span{overflow:visible} .wk-n{font-size:10px} .wk-plot,.wk-x{gap:3px} .wk-bar{border-radius:6px 6px 3px 3px} }
  /* resúmenes */
  .rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;margin-top:22px}
  .rg-b{display:flex;gap:12px;align-items:flex-start;min-width:0}
  .rg-l{width:26px;flex:none;font-size:12px;font-weight:700;color:var(--muted);padding-top:8px}
  .rg-c{display:flex;flex-wrap:wrap;gap:6px}
  .rg-t{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);
    background:var(--surface-2);transition:transform .15s,box-shadow .2s}
  .rg-t:hover{transform:translateY(-1px);box-shadow:0 0 0 2px var(--acc)}
  .rg-t.on{background:linear-gradient(160deg,#ffe066,#ff9f0a);color:#3b2604;box-shadow:0 4px 10px -6px #ff9f0a}
  @media (max-width:900px){ .pz-top{grid-template-columns:1fr;justify-items:center} .pz-main{width:100%} }
  @media (max-width:640px){
    .ptab{padding:10px 8px;font-size:13px;flex-direction:column;align-items:flex-start;gap:2px}
    .ptab i{display:none}
    .ptab .pt-c{margin-left:0;font-size:12px}
    .pz-body{padding:22px 16px 18px}
    .pz-h{font-size:24px}
    .rings{width:170px;height:170px}
    .ring-in b{font-size:38px}
    .tiles{gap:8px}
    .tile{padding:12px 10px 12px;border-radius:14px}
    .tile .v{flex-direction:column;gap:2px;align-items:flex-start}
    .tile .v b{font-size:24px}
    .tile .v span{font-size:11px}
    .wk-plot,.wk-x{gap:6px}
    .rgrid{grid-template-columns:1fr}
  }

  /* ================= BLOQUES: tarjetas con borde y textura ================= */
  .band-blocks{background:
      radial-gradient(color-mix(in srgb,var(--text) var(--dot-a),transparent) 1px,transparent 1.5px) 0 0/18px 18px,
      var(--band-blocks)}
  .tab[data-tab="b1"],.panel[data-block="b1"]{--blk-soft:var(--b1-soft);--blk-ink:var(--b1-ink);
    --pat:radial-gradient(var(--pat-c) 1.3px,transparent 1.8px) 0 0/12px 12px}
  .tab[data-tab="b2"],.panel[data-block="b2"]{--blk-soft:var(--b2-soft);--blk-ink:var(--b2-ink);
    --pat:repeating-linear-gradient(135deg,var(--pat-c) 0 1.2px,transparent 1.2px 9px)}
  .tab[data-tab="b3"],.panel[data-block="b3"]{--blk-soft:var(--b3-soft);--blk-ink:var(--b3-ink);
    --pat:linear-gradient(var(--pat-c) 1px,transparent 1px) 0 0/14px 14px,linear-gradient(90deg,var(--pat-c) 1px,transparent 1px) 0 0/14px 14px}
  .tab[data-tab="b4"],.panel[data-block="b4"]{--blk-soft:var(--b4-soft);--blk-ink:var(--b4-ink);
    --pat:radial-gradient(circle,transparent 2.6px,var(--pat-c) 3px,var(--pat-c) 3.8px,transparent 4.2px) 0 0/16px 16px}
  .tab,.panel{--pat-c:color-mix(in srgb,var(--blk-ink) var(--pat-a),transparent);--blk-line:color-mix(in srgb,var(--blk-ink) var(--blk-line-a,32%),transparent)}

  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border:0;overflow:visible}
  .tab{
    position:relative;overflow:hidden;isolation:isolate;min-height:96px;
    padding:16px;border-radius:var(--r-lg);border:1px solid var(--blk-line);background:var(--blk-soft);
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;
  }
  .tab::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--pat);
    -webkit-mask-image:linear-gradient(105deg,transparent 30%,#000 95%);mask-image:linear-gradient(105deg,transparent 30%,#000 95%)}
  .tab:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--blk-ink) 55%,transparent);box-shadow:0 8px 20px -12px var(--blk-ink)}
  .tab[aria-selected="true"]{border-color:var(--blk-ink);box-shadow:0 0 0 1px var(--blk-ink),0 10px 24px -14px var(--blk-ink)}
  .t-roman{color:var(--blk-ink)}
  .t-ring .bg{stroke:color-mix(in srgb,var(--blk-ink) 16%,transparent)}

  .panel{margin-top:16px;border:1px solid var(--blk-line);border-top:4px solid var(--blk-ink)}
  .p-head{position:relative;overflow:hidden;isolation:isolate;background:var(--blk-soft);border-bottom-color:var(--blk-line)}
  .p-head::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--pat);
    -webkit-mask-image:linear-gradient(100deg,transparent 40%,#000 100%);mask-image:linear-gradient(100deg,transparent 40%,#000 100%)}
  .p-tag{color:var(--blk-ink)}
  .p-stat{background:var(--surface);border:1px solid var(--blk-line)}

  /* checklist en tabla */
  @media (min-width:760px){
    .thead{display:grid;grid-template-columns:40px minmax(0,1fr) 104px 104px 104px;gap:14px;padding:10px 20px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--border);position:sticky;top:61px;z-index:5}
    .thead span:nth-child(n+3){text-align:center}
    .list{padding:0}
    .row{display:grid;grid-template-columns:40px minmax(0,1fr) 104px 104px 104px;gap:14px;padding:12px 20px;border-radius:0}
    .acts{display:contents}
    .tg{justify-content:center;border:0;background:transparent;height:44px;padding:0;border-radius:var(--r-sm)}
    .tg:hover{background:var(--surface-2)}
    .tg .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .tg .box{width:24px;height:24px;border-radius:7px;border-width:2px}
    .tg .box svg{width:15px;height:15px}
    .tg.on{background:transparent;color:inherit}
    .tg.on .box{background:var(--t);border-color:var(--t);color:var(--on)}
  }
  @media (max-width:900px){
    .widgets{grid-template-columns:1fr}
    .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:640px){
    .nav-c{gap:8px;padding:10px 12px}
    .brand{font-size:15px}
    .nav-r{gap:8px}
    .inap{padding:6px 14px}
    .theme-btn{width:32px;height:32px}
    .band{padding-bottom:32px}
    .band-blocks{padding-top:32px}
    .w-count b{font-size:38px}
    .tabs{grid-template-columns:1fr 1fr;gap:10px}
    .tab{padding:12px;min-height:0;border-radius:var(--r-md)}
    .t-ring{display:none}
    .panel{margin-top:0}
  }
  @media (max-width:380px){
    .nav-c{gap:6px;padding:10px}
    .nav-r{gap:6px}
    .brand{font-size:14px}
    .inap{padding:5px 10px;font-size:12px}
    .today{font-size:12px}
    .theme-btn{width:30px;height:30px}
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="nav" aria-label="Principal">

<script>
const THEME={a:["#a78bfa","#7c3aed"],b:["#fb923c","#c2410c"],r:["#fcd34d","#f59e0b"],confetti:["#7c3aed","#a78bfa","#c2410c","#ff7a45","#fbbf24"]};
/* ================= TEMARIO ================= */
const DATA = [
  { id:"b1", roman:"I", short:"Organización del Estado", title:"Organización del Estado y Administración electrónica", temas:[
    "Constitución Española de 1978: derechos, deberes y Corona.",
    "Cortes Generales, Tribunal Constitucional y Defensor del Pueblo.",
    "Gobierno: composición, nombramiento, cese y funciones.",
    "EBEP: derechos, provisión, promoción, carrera, situaciones, incompatibilidades y régimen sancionador. Transparencia. Agenda 2030/ODS.",
    "Igualdad, violencia de género, igualdad LGTBI, discapacidad y dependencia.",
    "Sociedad de la información, identidad y firma electrónica, DNIe y Agenda Digital.",
    "Protección de datos y derechos digitales.",
    "Acceso electrónico, procedimiento administrativo electrónico, ENS, ENI y Normas Técnicas de Interoperabilidad.",
    "Sedes electrónicas, canales, identificación/autenticación e infraestructuras y servicios comunes."
  ]},
  { id:"b2", roman:"II", short:"Tecnología básica", title:"Tecnología básica", temas:[
    "Informática básica, representación de la información, sistemas de información y arquitectura de ordenadores.",
    "Periféricos, impresión, almacenamiento, visualización y digitalización.",
    "Tipos abstractos, estructuras de datos, ficheros, algoritmos y formatos.",
    "Sistemas operativos: Windows, Unix/Linux y móviles.",
    "SGBD relacionales, orientados a objetos y NoSQL."
  ]},
  { id:"b3", roman:"III", short:"Desarrollo de sistemas", title:"Desarrollo de sistemas", temas:[
    "Modelado de datos y diseño de bases de datos, modelo relacional y normalización.",
    "Lenguajes de programación y fundamentos de programación.",
    "SQL, procedimientos almacenados, eventos y disparadores.",
    "Programación orientada a objetos, patrones y UML.",
    "Java EE/Jakarta EE y .NET: componentes, persistencia, seguridad e interfaces.",
    "Arquitecturas cliente/servidor y multicapas y servicios web.",
    "Aplicaciones web, front-end/servidor, HTML/XML, navegadores y scripting.",
    "Accesibilidad, diseño universal, usabilidad y seguridad en desarrollo.",
    "Repositorios, generación de código/documentación, metodologías, pruebas, control de versiones y plataformas colaborativas."
  ]},
  { id:"b4", roman:"IV", short:"Sistemas y comunicaciones", title:"Sistemas y comunicaciones", temas:[
    "Administración del sistema operativo y software base.",
    "Administración de bases de datos, almacenamiento, backup, recuperación y virtualización.",
    "Servidores de correo, protocolos, contenedores y microservicios.",
    "Redes LAN, usuarios, dispositivos, monitorización y tráfico.",
    "Seguridad de sistemas, criptografía, firma digital, CPD, incidencias y control remoto.",
    "Comunicaciones, medios de transmisión, equipos de interconexión, redes y comunicaciones inalámbricas.",
    "Modelos TCP/IP y OSI y protocolos TCP/IP.",
    "Internet, arquitectura, servicios y HTTP/HTTPS/SSL-TLS.",
    "Seguridad de redes, seguridad perimetral, acceso remoto, VPN y puesto de usuario.",
    "Redes locales, topologías, transmisión, acceso e interconexión."
  ]}
];
const TOTAL = DATA.reduce((s,b)=>s+b.temas.length,0);

/* ================= PLAZOS (edita aquí si cambian) =================
   Los colores viven en CSS (--c-a, --c-b, --c-r). THEME (arriba del script) solo define degradados y confeti. */
const PHASES = [
  {k:"a", name:"1ª lectura", deadline:"2026-12-18"},
  {k:"b", name:"2ª lectura", deadline:"2027-04-30"}
];
const RES = {k:"r", name:"Resúmenes"};

/* ================= ALMACENAMIENTO ================= */
const KEY="tai2026-progress-v1", UI_KEY="tai2026-ui-v5", START_KEY="tai2026-start";
const HERE_KEY="tai2026-here-v2", HERE_OLD_KEY="tai2026-here", DL_KEY="tai2026-deadlines";
const ISO=/^\d{4}-\d{2}-\d{2}$/;
const isISO=v=>typeof v==="string"&&ISO.test(v);
function load(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function store(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* fechas límite editables (se guardan en este navegador) */
const DEFAULT_DL=PHASES.map(p=>p.deadline);
function loadDeadlines(){
  const s=load(DL_KEY,{})||{};
  const a=isISO(s.a)?s.a:DEFAULT_DL[0], b=isISO(s.b)?s.b:DEFAULT_DL[1];
  [PHASES[0].deadline,PHASES[1].deadline] = a<b ? [a,b] : DEFAULT_DL;
}
loadDeadlines();

/* ================= FECHAS ================= */
const pad=n=>String(n).padStart(2,"0");
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const days=(a,b)=>Math.round((b-a)/864e5);
function fmt(d){
  const o={day:"numeric",month:"short"};
  if(d.getFullYear()!==today().getFullYear()) o.year="numeric";
  return d.toLocaleDateString("es-ES",o).replace(".","").replaceAll(" de "," ");
}
const n1=x=>x.toFixed(1).replace(".",",").replace(",0","");

/* ================= ESTADO =================
   state[id] = { a:bool 1ª lectura, b:bool 2ª lectura, r:bool resumen, da, db, dr: fechas } */
function normalize(raw){
  const out={};
  if(!raw||typeof raw!=="object") return out;
  for(const [id,v] of Object.entries(raw)){
    let s={a:false,b:false,r:false,da:null,db:null,dr:null};
    if(typeof v==="number"){ s.a=v>=1; s.b=v>=2; s.r=v>=3; }
    else if(v && typeof v==="object" && ("a" in v || "b" in v || "r" in v)){ Object.assign(s,v); }
    else if(v && typeof v==="object"){
      const l=v.l||0, d=Array.isArray(v.d)?v.d:[];
      s.a=l>=1; s.b=l>=2; s.da=d[0]||null; s.db=d[1]||null;
      s.r=!!v.r||l>=3; s.dr=v.rd||d[2]||null;
    }
    /* solo booleanos y fechas AAAA-MM-DD; la 2ª lectura es del resumen, así que lo implica */
    s={a:!!s.a,b:!!s.b,r:!!s.r||!!s.b,da:isISO(s.da)?s.da:null,db:isISO(s.db)?s.db:null,dr:isISO(s.dr)?s.dr:null};
    if(s.a||s.b||s.r) out[id]=s;
  }
  return out;
}
let state=normalize(load(KEY,{}));

/* "vas por aquí": una marca por bloque → here = { b1:{n:2,since:"AAAA-MM-DD"}, b4:{n:7,since:…} } */
function normHere(raw){
  const out={};
  if(!raw||typeof raw!=="object") return out;
  DATA.forEach(b=>{
    const h=raw[b.id]; if(!h||typeof h!=="object") return;
    const n=Number(h.n);
    if(Number.isInteger(n)&&n>=1&&n<=b.temas.length) out[b.id]={n,since:isISO(h.since)?h.since:toISO(today())};
  });
  return out;
}
function loadHere(){
  let raw=load(HERE_KEY,null); if(!raw||typeof raw!=="object") raw={};
  /* migración desde la marca única antigua {id:"b1-2",since} */
  const old=load(HERE_OLD_KEY,null);
  if(old&&typeof old.id==="string"){ const [bid,n]=old.id.split("-"); if(!raw[bid]) raw[bid]={n:+n,since:old.since}; }
  try{ localStorage.removeItem(HERE_OLD_KEY); }catch(e){}
  return normHere(raw);
}
let here=loadHere();
const hereOf=id=>{ const [bid,n]=id.split("-"); const h=here[bid]; return h&&h.n===+n?h:null; };
function setHere(id){
  const [bid,n]=id.split("-");
  const on=!hereOf(id);
  if(on) here[bid]={n:+n,since:toISO(today())}; else delete here[bid];
  store(HERE_KEY,here); update();
  return on;
}
function loadStart(){ const s=load(START_KEY,null); return isISO(s)?s:toISO(today()); }
let ui=load(UI_KEY,{tab:"b1"});
let start=loadStart();
store(START_KEY,start); store(KEY,state); store(HERE_KEY,here);

/* recarga todo desde localStorage (otra pestaña abierta o importación) */
function reloadFromStorage(){
  state=normalize(load(KEY,{}));
  here=normHere(load(HERE_KEY,{}));
  start=loadStart();
  loadDeadlines();
}

const get=id=>state[id]||{a:false,b:false,r:false,da:null,db:null,dr:null};
function save(id,s){ if(!s.a&&!s.b&&!s.r) delete state[id]; else state[id]=s; store(KEY,state); }
function count(k,block){
  let c=0;(block?[block]:DATA).forEach(b=>b.temas.forEach((_,i)=>{ if(get(`${b.id}-${i+1}`)[k]) c++; }));
  return c;
}

/* ================= CÁLCULO DE PLAZOS ================= */
function phaseInfo(p,i){
  const now=today();
  const from=i===0?fromISO(start):fromISO(PHASES[i-1].deadline);
  const to=fromISO(p.deadline);
  const done=count(p.k), left=TOTAL-done;
  const span=Math.max(days(from,to),1);
  const t=Math.min(Math.max(days(from,now)/span,0),1);
  const dLeft=days(now,to);
  /* ritmo necesario desde hoy (o desde el inicio de la fase si aún no ha empezado) */
  const pace=left/(Math.max(days(now<from?from:now,to),1)/7);
  /* proyección con tu ritmo real: temas hechos / días de fase transcurridos (hoy cuenta) */
  const started=now>=from;
  const elapsed=started?days(from,now)+1:0;
  /* esta semana (lunes a domingo) frente al objetivo semanal */
  const mon=mondayOf(now);
  const thisWeek=marksOf(p.k).filter(d=>d&&+d>=+mon).length;
  /* objetivo fijo para toda la semana: lo que quedaba el lunes (o al empezar la fase) repartido hasta la fecha límite */
  const wkStart=mon<from?from:mon;
  const goal=Math.ceil((left+thisWeek)/(Math.max(days(wkStart,to),1)/7)-1e-9);
  /* ritmo real y fecha estimada con al menos 7 días de datos: antes, 1 tema el primer día daría "7/semana" */
  const ready=elapsed>=7;
  const real=started&&done>0&&ready?done/elapsed*7:null;   // temas/semana
  const early=started&&!ready;
  let proj=null, margin=null;
  if(real&&left>0){ proj=new Date(now); proj.setDate(proj.getDate()+Math.ceil(left/(real/7))); margin=days(proj,to); }
  return {from,to,done,left,t,dLeft,pace,started,elapsed,real,proj,margin,early,thisWeek,goal};
}

/* ================= RENDER ================= */
const ICON_BM=`<svg class="bm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg>`;
const ICON_PEN=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>`;
function openDL(k){
  const i=PHASES.findIndex(p=>p.k===k), p=PHASES[i];
  const inp=document.getElementById(`dli-${k}`);
  inp.value=p.deadline;
  const addDay=(iso,n)=>{const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d);};
  if(i===0){ inp.min=start; inp.max=addDay(PHASES[1].deadline,-1); }
  else{ inp.min=addDay(PHASES[0].deadline,1); inp.removeAttribute("max"); }
  document.getElementById(`wdl-${k}`).hidden=true;
  document.getElementById(`dlf-${k}`).hidden=false;
  inp.focus();
}
function closeDL(k){
  document.getElementById(`dlf-${k}`).hidden=true;
  document.getElementById(`wdl-${k}`).hidden=false;
  document.querySelector(`[data-edit="${k}"]`).focus();
}
function saveDL(k,v){
  const i=PHASES.findIndex(p=>p.k===k);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ toast("Elige una fecha válida"); return; }
  if(i===0&&v>=PHASES[1].deadline){ toast("La 1ª lectura tiene que acabar antes que la 2ª"); return; }
  if(i===1&&v<=PHASES[0].deadline){ toast("La 2ª lectura tiene que acabar después de la 1ª"); return; }
  PHASES[i].deadline=v;
  store(DL_KEY,{a:PHASES[0].deadline,b:PHASES[1].deadline});
  closeDL(k); update();
  toast(`${PHASES[i].name}: nueva fecha límite el ${fmt(fromISO(v))}`);
}
document.addEventListener("submit",e=>{
  const f=e.target.closest(".dl-form"); if(!f) return;
  e.preventDefault(); saveDL(f.dataset.k,f.querySelector("input").value);
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  const f=e.target.closest&&e.target.closest(".dl-form"); if(f) closeDL(f.dataset.k);
});
/* ================= PLAZOS: panel con pestañas ================= */
const PTABS=[{k:"a",name:PHASES[0].name},{k:"r",name:RES.name},{k:"b",name:PHASES[1].name}];
const pl=n=>`${n} ${n===1?"día":"días"}`;
const perWeek=x=>`${n1(x)} ${n1(x)==="1"?"tema":"temas"}/semana`;

function dlEditor(p){
  return `<div class="pz-dl" id="wdl-${p.k}">
      <span>Límite<b>${fmt(fromISO(p.deadline))}</b></span>
      <button type="button" class="edit" data-edit="${p.k}" aria-label="Editar fecha límite de la ${p.name}" title="Editar fecha límite">${ICON_PEN}</button>
    </div>
    <form class="dl-form" id="dlf-${p.k}" data-k="${p.k}" hidden>
      <label class="sr" for="dli-${p.k}">Nueva fecha límite de la ${p.name}</label>
      <input type="date" id="dli-${p.k}" required>
      <button type="submit" class="btn-p">Guardar</button>
      <button type="button" class="btn-g" data-cancel="${p.k}" aria-label="Cancelar" title="Cancelar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </form>`;
}

/* degradados por fase (anillos y barras) */
const GRAD={a:["#c084fc","#7c3aed"],b:["#ffb057","#ff5a1f"],r:["#ffe066","#ff9f0a"],time:["#5ac8fa","#0a84ff"]};
const lastOff={};                         // valores anteriores → las animaciones parten de donde estaban
const mondayOf=d=>{ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const fmtS=d=>d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}).replace(".","").replaceAll(" de "," ");

function marksOf(k){
  const out=[]; DATA.forEach(b=>b.temas.forEach((_,i)=>{ const s=get(`${b.id}-${i+1}`); if(s[k]) out.push(s["d"+k]?fromISO(s["d"+k]):null); }));
  return out;
}

/* anillos concéntricos: fuera temas, dentro plazo consumido */
function rings(k,outer,inner){
  const S=196, c=S/2, ro=86, ri=62;
  const arc=(id,r,frac,g)=>{ const L=2*Math.PI*r, off=L*(1-Math.min(Math.max(frac,0),1));
    return `<circle class="arc" data-id="${id}" data-off="${off}" cx="${c}" cy="${c}" r="${r}" stroke="url(#${g})" stroke-dasharray="${L}" stroke-dashoffset="${lastOff[id]??L}" ${frac<=0?'opacity="0"':""}/>`; };
  const grad=(id,[a,b])=>`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  return `<svg viewBox="0 0 ${S} ${S}" aria-hidden="true"><defs>${grad(`rg-${k}`,GRAD[k])}${grad("rg-time",GRAD.time)}</defs>
      <circle class="trk o" cx="${c}" cy="${c}" r="${ro}"/>${arc(`o-${k}`,ro,outer,`rg-${k}`)}
      ${inner==null?"":`<circle class="trk i" cx="${c}" cy="${c}" r="${ri}"/>${arc(`i-${k}`,ri,inner,"rg-time")}`}
    </svg>`;
}
function ringBlock(k,done,inner,legend){
  return `<div class="ring-wrap"><div class="rings" role="img" aria-label="${done} de ${TOTAL} temas${inner!=null?`; plazo consumido ${Math.round(inner*100)} %`:""}">
      ${rings(k,done/TOTAL,inner)}
      <div class="ring-in"><b>${done}</b><span>de ${TOTAL}</span></div>
    </div>${legend}</div>`;
}

const tile=(l,v,u="",d="",dc="")=>`<div class="tile"><small>${l}</small><div class="v"><b>${v}</b>${u?`<span>${u}</span>`:""}</div>${d?`<span class="d ${dc}">${d}</span>`:""}</div>`;

/* titular + métricas según el estado de la fase */
function phaseView(p,f){
  const ritmo=x=>n1(x), sem="temas/sem";
  if(f.left===0){
    const ds=marksOf(p.k).filter(Boolean), last=ds.length?new Date(Math.max(...ds)):null;
    const m=last?days(last,f.to):null;
    return {cls:"ok",h:`${p.name} <em>completada</em>`,
      tiles:tile("Leídos",TOTAL,`de ${TOTAL}`)+tile("Terminada",last?fmtS(last):"—")+tile("Margen",m==null?"—":m,m==null?"":"días")};
  }
  if(f.dLeft<0) return {cls:"bad",h:`Plazo <em>vencido</em>`,
    tiles:tile("Faltan",f.left,"temas")+tile("Venció",fmtS(f.to))+tile("Tu ritmo",f.real?ritmo(f.real):"—",f.real?sem:"")};
  if(!f.started) return {cls:"",h:`Empieza el <em>${fmt(f.from)}</em>`,
    tiles:tile("Empieza en",days(today(),f.from),"días")+tile("Duración",days(f.from,f.to),"días")+tile("Necesitarás",ritmo(f.pace),sem)};
  if(f.early){
    const miss=Math.max(f.goal-f.thisWeek,0);
    const dLeftWk=7-((today().getDay()+6)%7);                 // hoy incluido, hasta el domingo
    return {cls:miss===0?"ok":"",
      h:miss===0?`Objetivo de la semana <em>cumplido</em>`:`Esta semana: <em>${f.thisWeek} de ${f.goal}</em> temas`,
      note:`La fecha estimada de fin aparece cuando tengas 7 días de datos.`,
      tiles:tile("Te faltan esta semana",miss,miss===1?"tema":"temas")+tile("Quedan de semana",dLeftWk,dLeftWk===1?"día":"días")+tile("Necesario",ritmo(f.pace),sem)};
  }
  if(f.real==null) return {cls:f.elapsed>7?"warn":"",h:`Aún <em>sin temas</em> leídos`,
    tiles:tile("Quedan",f.dLeft,"días")+tile("Necesario",ritmo(f.pace),sem)};
  const diff=f.real-f.pace, note="";
  const d=Math.abs(diff)<0.05?["Justo lo necesario",""]:diff>0?[`+${n1(diff)} de sobra`,"ok"]:[`−${n1(-diff)} de menos`,"bad"];
  return {cls:f.margin>=0?"ok":"bad",note,
    h:f.margin>=0?`Llegas con <em>${pl(f.margin)}</em> de margen`:`No llegas: <em>${pl(-f.margin)} tarde</em>`,
    tiles:tile("Acabarías",fmtS(f.proj))+tile("Tu ritmo",ritmo(f.real),sem,d[0],d[1])+tile("Necesario",ritmo(f.pace),sem)};
}

/* temas por semana, con la línea del ritmo necesario */
function weeks(p,f){
  const now=today(), k=p.k, wNow=+mondayOf(now);
  const w0=mondayOf(f.from), wEnd=mondayOf(f.to>now?f.to:now);
  let list=[]; for(let d=new Date(w0); d<=wEnd; d.setDate(d.getDate()+7)) list.push({d:new Date(d),n:0});
  marksOf(k).forEach(d=>{ const w=+mondayOf(d&&d>=f.from?d:f.from); const it=list.find(x=>+x.d===w); if(it) it.n++; });
  if(list.length>26){ const ci=list.findIndex(x=>+x.d===wNow); list=list.slice(Math.max(0,Math.min(ci-12,list.length-26)),Math.max(0,Math.min(ci-12,list.length-26))+26); }
  const need=f.left>0&&f.dLeft>=0?f.pace:null;
  const max=Math.max(...list.map(x=>x.n),need?need*1.35:0,2);
  const [g1,g2]=GRAD[k], n=list.length, step=n>14?2:1;
  const cols=list.map(x=>{ const w=+x.d, cur=w===wNow, fut=w>wNow, id=`wk-${k}-${w}`, h=x.n/max*100;
    return `<div class="wk-col${cur?" cur":""}${fut?" fut":""}"><span class="wk-n">${fut?"":x.n}</span><i class="wk-bar${x.n?"":" zero"}" data-id="${id}" data-h="${h}" style="height:${lastOff[id]??0}%"></i></div>`; }).join("");
  const xs=list.map((x,i)=>{ const w=+x.d, cur=w===wNow, last=i===n-1;
    const cls=[cur?"cur":"", (i%step&&!cur&&!last)?"sk":"", (i%4&&!cur&&!last)?"skm":""].join(" ");
    const sun=new Date(x.d); sun.setDate(sun.getDate()+6);
    return `<span class="${cls}" title="Semana del ${fmt(x.d)} al ${fmt(sun)}">${fmtS(x.d)}</span>`; }).join("");
  return `<div class="weeks" style="--g1:${g1};--g2:${g2}">
      <div class="wk-h"><h4>Temas por semana <span class="wk-sub">lunes a domingo</span></h4>${need?`<p><i></i>Necesario para llegar</p>`:""}</div>
      <div class="wk-plot" role="img" aria-label="Temas leídos por semana${need?`; necesario ${n1(need)} por semana`:""}">
        ${cols}
        ${need?`<div class="wk-need" style="bottom:${need/max*100}%"><span>${n1(need)}/sem</span></div>`:""}
      </div>
      <div class="wk-x">${xs}</div>
    </div>`;
}

/* resúmenes: un cuadro por tema, agrupados por bloque; pulsar lleva al tema */
function resGrid(){
  return `<div class="rgrid">${DATA.map(b=>`<div class="rg-b"><span class="rg-l">${b.roman}</span><div class="rg-c">${
    b.temas.map((t,i)=>{ const id=`${b.id}-${i+1}`, on=get(id).r;
      return `<button type="button" class="rg-t${on?" on":""}" data-goto="${id}" title="Bloque ${b.roman} · tema ${i+1}${on?" · resumido":""}" aria-label="Bloque ${b.roman}, tema ${i+1}: ${on?"resumido":"sin resumir"}. Ir al tema"><span>${i+1}</span></button>`;
    }).join("")}</div></div>`).join("")}</div>`;
}

/* anima de lo que había a lo nuevo */
function animateIn(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll(".arc").forEach(el=>{ el.style.strokeDashoffset=el.dataset.off; lastOff[el.dataset.id]=+el.dataset.off; });
    root.querySelectorAll(".wk-bar").forEach(el=>{ el.style.height=el.dataset.h+"%"; lastOff[el.dataset.id]=+el.dataset.h; });
  }));
}

function renderPlazo(infos,activeIdx){
  if(!ui.ptab||!PTABS.some(t=>t.k===ui.ptab)) ui.ptab=activeIdx<0?"r":PHASES[activeIdx].k;
  const cur=ui.ptab;
  document.getElementById("ptabs").innerHTML=PTABS.map(t=>{
    const n=count(t.k), sel=t.k===cur;
    return `<button type="button" class="ptab" role="tab" id="ptab-${t.k}" data-ptab="${t.k}" data-k="${t.k}" aria-selected="${sel}" aria-controls="pzBody" tabindex="${sel?0:-1}">
      <i></i><span class="pt-n">${t.name}</span><span class="pt-c">${n}/${TOTAL}</span></button>`;
  }).join("");
  const body=document.getElementById("pzBody");
  body.dataset.k=cur; body.setAttribute("aria-labelledby",`ptab-${cur}`);
  if(cur==="r"){
    const n=count("r");
    body.innerHTML=`<div class="pz-top">
        ${ringBlock("r",n,null,`<div class="ring-leg"><span><i></i>Resumidos <b>${Math.round(n/TOTAL*100)} %</b></span></div>`)}
        <div class="pz-main">
          <p class="pz-eyebrow">Sin fecha límite</p>
          <p class="pz-h ${n===TOTAL?"ok":""}">${n===TOTAL?"Todos <em>resumidos</em>":`<em>${TOTAL-n}</em> temas por resumir`}</p>
          ${resGrid()}
        </div>
      </div>`;
    animateIn(body); return;
  }
  const i=PHASES.findIndex(p=>p.k===cur), p=PHASES[i], f=infos[i], v=phaseView(p,f);
  const legend=`<div class="ring-leg"><span><i></i>Leídos <b>${Math.round(f.done/TOTAL*100)} %</b></span><span><i></i>Plazo <b>${Math.round(f.t*100)} %</b></span></div>`;
  body.innerHTML=`<div class="pz-top">
      ${ringBlock(p.k,f.done,f.t,legend)}
      <div class="pz-main">
        <div class="pz-head">
          <div><p class="pz-h ${v.cls}">${v.h}</p><p class="pz-note">${v.note||""}</p></div>
          ${dlEditor(p)}
        </div>
        <div class="tiles">${v.tiles}</div>
      </div>
    </div>
    ${f.started&&f.left>0?weeks(p,f):""}`;
  animateIn(body);
}

}

/* ================= NÚMEROS ANIMADOS ================= */
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function countTo(el,to){
  const from=+el.dataset.v||0; el.dataset.v=to;
  if(from===to||reduced()){ el.textContent=to; return; }
  const t0=performance.now(),dur=700;
  (function step(t){ const k=Math.min((t-t0)/dur,1),e=1-Math.pow(1-k,3); el.textContent=Math.round(from+(to-from)*e); if(k<1) requestAnimationFrame(step); })(t0);
}

function stateHTML(s,h){
  const out=[];
  if(h) out.push(`<span class="here-tag"><i style="background:var(--phase)"></i>Vas por aquí · desde el ${fmt(fromISO(h.since))}</span>`);
  if(!s.a&&!s.b&&!s.r) return out.length?out.join(""):`<span>Pendiente</span>`;
  if(s.a) out.push(`<span><i style="background:var(--c-a)"></i>1ª${s.da?" · "+fmt(fromISO(s.da)):""}</span>`);
  if(s.r) out.push(`<span><i style="background:var(--c-r)"></i>Resumen${s.dr?" · "+fmt(fromISO(s.dr)):""}</span>`);
  if(s.b) out.push(`<span><i style="background:var(--c-b)"></i>2ª${s.db?" · "+fmt(fromISO(s.db)):""}</span>`);
  return out.join("");
}

/* ================= UPDATE ================= */
function update(){
  const infos=PHASES.map(phaseInfo);
  const activeIdx=infos.findIndex(f=>f.left>0);
  renderPlazo(infos,activeIdx);

  /* el color de progreso de bloques = fase activa */
  const k=activeIdx<0?"b":PHASES[activeIdx].k, kName=activeIdx<0?PHASES[1].name:PHASES[activeIdx].name;
  document.documentElement.style.setProperty("--phase",`var(--c-${k})`);
  document.getElementById("tabHint").innerHTML=`<i></i>Progreso de la ${kName}`;
  DATA.forEach(b=>{
    const len=b.temas.length,c=count(k,b);
    const r=document.getElementById(`tr-${b.id}`); r.style.strokeDashoffset=r.dataset.c*(1-c/len);
    const h=here[b.id], tab=document.getElementById(`tab-${b.id}`);
    document.getElementById(`tc-${b.id}`).innerHTML=`${c}/${len} leídos · ${count("r",b)} res.`+(h?`<span class="sr">, vas por el tema ${h.n}</span>`:"");
    tab.classList.toggle("has-here",!!h);
    tab.querySelector(".t-here-n").textContent=h?h.n:"";
  });

  const b=DATA.find(x=>x.id===ui.tab)||DATA[0], len=b.temas.length;
  ["a","r","b"].forEach(key=>{
    const c=count(key,b);
    document.getElementById(`ps-${key}`).textContent=`${c}/${len}`;
    document.getElementById(`pm-${key}`).style.width=(c/len*100)+"%";
  });
  b.temas.forEach((_,i)=>{
    const id=`${b.id}-${i+1}`, s=get(id), row=document.getElementById(`row-${id}`);
    row.classList.toggle("ra",s.a&&!s.b);
    row.classList.toggle("rb",s.b);
    const h=hereOf(id), isHere=!!h;
    row.classList.toggle("here",isHere);
    const nb=row.querySelector(".num"); nb.setAttribute("aria-pressed",isHere);
    nb.setAttribute("aria-label",`Tema ${i+1}: ${isHere?"quitar marca de por dónde vas":"marcar por dónde vas"}`);
    nb.title=isHere?"Quitar marca":"Marcar por dónde vas";
    row.querySelector(".tstate").innerHTML=stateHTML(s,h);
    row.querySelectorAll(".tg").forEach(t=>{ const on=!!s[t.dataset.k]; t.classList.toggle("on",on); t.setAttribute("aria-pressed",on); });
  });
}

/* ================= EFECTOS ================= */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");
let parts=[],running=false;
function resize(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; }
addEventListener("resize",resize); resize();
function burst(x,y,colors,n=18,spread=1){
  if(reduced()) return;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=(2+Math.random()*4)*spread;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2*spread,g:.18,life:1,s:3+Math.random()*4,c:colors[i%colors.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,sq:Math.random()<.5});
  }
  if(!running){ running=true; requestAnimationFrame(tick); }
}
function confetti(){
  for(let k=0;k<5;k++) setTimeout(()=>burst(innerWidth*(.15+.175*k),innerHeight*.35,THEME.confetti,40,2.2),k*90);
}
function tick(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.014;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;cx.translate(p.x,p.y);cx.rotate(p.r);
    if(p.sq) cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else{cx.beginPath();cx.arc(0,0,p.s/2,0,Math.PI*2);cx.fill();}
    cx.restore();
  }
  if(parts.length) requestAnimationFrame(tick); else{running=false;cx.clearRect(0,0,innerWidth,innerHeight);}
}
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }

/* ================= INTERACCIÓN ================= */
document.addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); if(ed){ openDL(ed.dataset.edit); return; }
  const hb=e.target.closest("[data-here]");
  if(hb){ const id=hb.dataset.here, [bid,n]=id.split("-"), blk=DATA.find(b=>b.id===bid);
    const on=setHere(id);
    toast(on?`Bloque ${blk.roman}: vas por el tema ${n}`:`Bloque ${blk.roman}: marca quitada`); return; }
  const go=e.target.closest("[data-goto]");
  if(go){ const id=go.dataset.goto; ui.tab=id.split("-")[0]; store(UI_KEY,ui); renderPanel();
    const row=document.getElementById(`row-${id}`);
    row.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"center"});
    row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
    row.querySelector(".num").focus({preventScroll:true}); return; }
  const cn=e.target.closest("[data-cancel]"); if(cn){ closeDL(cn.dataset.cancel); return; }
  const t=e.target.closest(".tg");
  if(t){
    const id=t.dataset.id,k=t.dataset.k,s={...get(id)};
    const blk=DATA.find(x=>id.startsWith(x.id+"-")),len=blk.temas.length;
    const before={blk:count(k,blk),all:count(k)};
    s[k]=!s[k]; s["d"+k]=s[k]?toISO(today()):null;
    /* la 2ª lectura es del resumen: marcar la 2ª marca el resumen y quitar el resumen quita la 2ª.
       La 1ª lectura y el resumen son independientes. */
    if(k==="b"&&s.b&&!s.r){ s.r=true; s.dr=toISO(today()); }
    const cascade=k==="r"&&!s.r&&s.b;
    if(cascade){ s.b=false; s.db=null; }
    save(id,s);
    /* si terminas de leer el tema que tenías marcado, la marca de ese bloque se quita sola */
    let cleared=false;
    if(s[k]&&k!=="r"&&hereOf(id)){ delete here[blk.id]; store(HERE_KEY,here); cleared=true; }
    update();
    if(cascade) toast(`Tema ${id.split("-")[1]}: quitada también la 2ª lectura`);
    if(s[k]){
      const r=t.getBoundingClientRect();
      burst(r.left+r.width/2,r.top+r.height/2,THEME[k]);
      const name=k==="r"?"resúmenes":PHASES.find(p=>p.k===k).name;
      if(cleared) toast(`Bloque ${blk.roman}, tema ${id.split("-")[1]} leído: marca de "vas por aquí" quitada`);
      if(count(k)===TOTAL&&before.all<TOTAL){confetti();toast(k==="r"?"Todos los resúmenes hechos":`${name} del temario completa`);}
      else if(count(k,blk)===len&&before.blk<len){confetti();toast(`Bloque ${blk.roman}: ${name} ${k==="r"?"completos":"completa"}`);}
    }
    return;
  }
  const pt=e.target.closest("[data-ptab]"); if(pt){ selectPtab(pt.dataset.ptab); return; }
  const tab=e.target.closest(".tab");
  if(tab){ ui.tab=tab.dataset.tab; store(UI_KEY,ui); renderPanel(); }
});
document.getElementById("ptabs").addEventListener("keydown",e=>{
  if(!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  e.preventDefault();
  const i=PTABS.findIndex(t=>t.k===ui.ptab), d=e.key==="ArrowRight"?1:-1;
  selectPtab(PTABS[(i+d+PTABS.length)%PTABS.length].k,true);
});
document.getElementById("tabs").addEventListener("keydown",e=>{
  const keys=["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"];
  if(!keys.includes(e.key)) return;
  e.preventDefault();
  const dir=(e.key==="ArrowRight"||e.key==="ArrowDown")?1:-1;
  const i=DATA.findIndex(b=>b.id===ui.tab);
  ui.tab=DATA[(i+dir+DATA.length)%DATA.length].id;
  store(UI_KEY,ui); renderPanel(); document.getElementById(`tab-${ui.tab}`).focus();
});

/* fecha de hoy y año del footer */
function paintDate(){
  const d=new Date(), el=document.getElementById("today");
  el.dateTime=toISO(d);
  const wd=d.toLocaleDateString("es-ES",{weekday:"long"});
  const dm=d.toLocaleDateString("es-ES",{day:"numeric",month:"long"});
  el.innerHTML=`<span class="dl"><span class="long">${wd}, </span>${dm}</span><span class="ds">${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(-2)}</span>`;
  document.getElementById("year").textContent=d.getFullYear();
}

/* otra pestaña con la app abierta cambió datos: recargar para no pisarlos al guardar */
addEventListener("storage",e=>{
  if(e.key!==null&&![KEY,HERE_KEY,DL_KEY,START_KEY].includes(e.key)) return;
  reloadFromStorage(); update();
});

/* ================= COPIA DE SEGURIDAD ================= */
function exportData(){
  const data={app:"OposiTAI",v:1,exported:new Date().toISOString(),
    progress:state,here,deadlines:{a:PHASES[0].deadline,b:PHASES[1].deadline},start};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  const a=document.createElement("a"); a.href=url; a.download=`opositai-${toISO(today())}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Copia descargada");
}
function importData(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let d; try{ d=JSON.parse(rd.result); }catch(e){ toast("El archivo no es una copia válida"); return; }
    if(!d||d.app!=="OposiTAI"||!d.progress||typeof d.progress!=="object"){ toast("El archivo no es una copia de OposiTAI"); return; }
    if(!confirm("Se sustituirá el progreso de este navegador por el de la copia. ¿Continuar?")) return;
    store(KEY,normalize(d.progress)); store(HERE_KEY,normHere(d.here));
    if(d.deadlines&&isISO(d.deadlines.a)&&isISO(d.deadlines.b)&&d.deadlines.a<d.deadlines.b) store(DL_KEY,{a:d.deadlines.a,b:d.deadlines.b});
    if(isISO(d.start)) store(START_KEY,d.start);
    reloadFromStorage(); update(); toast("Copia restaurada");
  };
  rd.onerror=()=>toast("No se pudo leer el archivo");
  rd.readAsText(file);
}
document.getElementById("bkExport").addEventListener("click",exportData);
document.getElementById("bkImport").addEventListener("click",()=>document.getElementById("bkFile").click());
document.getElementById("bkFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) importData(f); e.target.value=""; });

paintDate(); renderTabs(); renderPanel();

  const cur=root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark";
  root.dataset.theme=next;
  try{localStorage.setItem("tai2026-theme",next);}catch(e){}
});
